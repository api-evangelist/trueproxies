name: TrueProxies
aid: trueproxies
description: 'TrueProxies, LLC (USA) sells residential and datacenter proxies (HTTP/HTTPS/SOCKS5) for developers
  and data teams, priced per hour, per GB or per day: unlimited-bandwidth Residential IPv4 at a chosen speed tier,
  GB-based Residential IPv4 with country, city, region and ASN targeting, and Datacenter IPv6. Beyond the proxy
  gateways it publishes the TrueProxies Customer API (OpenAPI 3.1 at api.trueproxies.com/v1/openapi.json), a scoped-Bearer-key
  REST API for managing existing proxy services, whitelists, credentials, usage analytics and invoices, with technical
  docs at docs.trueproxies.com.'
